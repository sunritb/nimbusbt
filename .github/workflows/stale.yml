name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. If it is still relevant,
            leave a comment or it will be closed in 7 days.
          stale-pr-message: >
            This pull request has been inactive for 30 days. If it is still in
            progress, leave a comment or it will be closed in 7 days.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if the issue remains.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen when work resumes.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 7
          days-before-pr-close: 7
